version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: docscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docscan}
      POSTGRES_USER: ${POSTGRES_USER:-docscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - docscan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docscan} -d ${POSTGRES_DB:-docscan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: docscan_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - docscan_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docscan_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files_data:/app/storage
      - logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - docscan_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docscan_worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files_data:/app/storage
      - logs:/app/logs
    networks:
      - docscan_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    image: nginx:1.25-alpine
    container_name: docscan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - docscan_net

volumes:
  postgres_data:
  redis_data:
  files_data:
  logs:

networks:
  docscan_net:
    driver: bridge
